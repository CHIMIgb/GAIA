name: Propuesta o fallo del roadmap
description: Falta algo, o un paso del ROADMAP no está claro. Para bugs usa el reporte de bug.
title: "[propuesta] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Si algo **no funciona**, abre un reporte de bug: esta plantilla es para lo que
        falta o para lo que no está claro.

  - type: input
    id: resumen
    attributes:
      label: Qué falta, en una frase
      placeholder: El glob 3D no carga la textura de alta resolución al alejarse
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: Qué tipo de cosa es
      options:
        - Paso del ROADMAP que falta o está mal especificado
        - Paso del ROADMAP que no entiendo
        - Mejora de algo ya existente
        - Deuda técnica que encontré
    validations:
      required: true

  - type: input
    id: paso
    attributes:
      label: Paso del ROADMAP al que corresponde
      description: Con su número, del tipo 0.8.4 o 1.2.2. Si es una propuesta nueva, "ninguno".
      placeholder: 1.3.1
    validations:
      required: true

  - type: input
    id: rf
    attributes:
      label: RF / RNF relacionada
      description: Están al principio de cada fase en el ROADMAP. Si ninguna, "—".
      placeholder: RF-01

  - type: textarea
    id: porque
    attributes:
      label: Por qué importa
      description: Qué se rompe, qué queda a medias o qué doc queda contradicho al no hacerlo.
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: criterio
    attributes:
      label: Criterio de aceptación propuesto
      description: Cómo se sabe que está hecho, en una frase verificable. El estilo de los pasos reales está en la DoD §3.
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Qué toca
      description: Marca lo que aplique y di por qué.
      value: |
        - Contrato de la API o un endpoint
        - Valores canónicos de un doc (TTL, rate limit, retención, presupuestos)
        - Un doc de `docs/`
        - Solo código

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que has considerado
      description: Con lo que ya existe, mejor.
      value: |
        -
