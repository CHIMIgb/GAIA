[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url no se fija aquí: env.py lo toma de settings.DATABASE_URL
# (docs/GAIA_DATABASE.md §6.4) para que no viva el DSN en el repo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
