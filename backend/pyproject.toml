[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=5.0.7,<6",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.38.0",
    "httpx2>=2.13.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

asyncio_mode = "auto"
# Cobertura en toda ejecución (ROADMAP 0.6.10): el criterio del paso es que la suite
# *reporte* con el umbral activo, no que se pueda pedir a mano.
addopts = "--cov=app --cov-report=term:skip-covered"

[tool.coverage.report]
# Umbral base de F0 tal y como lo fija el ROADMAP 0.6.10. Es deliberadamente holgado:
# entra el código de F1-F6 antes que sus tests, y un umbral que bloquea el CI hasta
# alcanzar el rojo acaba siempre saltándose.
fail_under = 60
skip_covered = true
